name: Build Native

permissions:
  contents: write
  actions: write

on:
  release:
    types: [created, published]
  workflow_run:
    workflows:
      - New cloudflared Release
    types:
      - completed
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: freebsd
            assetName: cloudflared-freebsd14-amd64
          - os: netbsd
            assetName: cloudflared-netbsd10-amd64
          - os: openbsd
            assetName: cloudflared-openbsd7-amd64
    env:
      GOEXPERIMENT: "noboringcrypto"
      CGO_ENABLED: 0
    steps:
      - name: Get latest release tag
        id: get_release
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo
            });
            core.setOutput('tag_name', data.tag_name);

      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_release.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      # Build step for FreeBSD
      - name: Build from Source on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          envs: "GOEXPERIMENT CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            /usr/sbin/pkg-static bootstrap -f
            pkg update -f
            pkg upgrade -f -y
            pkg install -f -y pcre2 gmake sudo bash git go golangci-lint curl wget fakeroot libffi rubygem-fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            go mod download
            go mod tidy
            go install golang.org/x/tools/cmd/goimports@latest
            gmake cloudflared

      # Build step for NetBSD
      - name: Build from Source on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          envs: "GOEXPERIMENT CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/pkg/sbin:/usr/pkg/bin:$PATH
            PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -f '1 2' -d.)/All/"
            export PKG_PATH
            pkg_add -U pkgin pkg_alternatives
            pkgin update
            pkgin -y install gmake sudo bash git go golangci-lint curl wget fakeroot libffi ruby32 
            pkg_alternatives rebuild
            gem install fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            go mod download
            go mod tidy
            go install golang.org/x/tools/cmd/goimports@latest
            gmake cloudflared

      # Build step for OpenBSD
      - name: Build from Source on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.7"
          envs: "GOEXPERIMENT CGO_ENABLED"
          usesh: true
          mem: 4096
          prepare: |
            pkg_add -xaz gmake sudo-- bash git go curl wget libffi ruby-34
            gem34 install fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            go mod download
            go mod tidy
            go install golang.org/x/tools/cmd/goimports@latest
            gmake cloudflared

      - name: Authenticate GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Upload build to GitHub Release
        run: |
          mv cloudflared ${{ matrix.assetName }}
          gh release upload "${{ steps.get_release.outputs.tag_name }}" \
            ${{ matrix.assetName }} \
            --clobber

      - name: Prune older successful runs
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepSuccessfulRuns = 7;
            const workflowRef = process.env.GITHUB_WORKFLOW_REF || '';
            const workflowFile = workflowRef
              ? workflowRef.split('@')[0].split('/').pop()
              : 'build_unix.yaml';

            let kept = 0;
            let page = 1;
            let permissionDenied = false;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                status: 'completed',
                per_page: 100,
                page
              });

              const runs = data.workflow_runs;
              if (!runs.length) {
                break;
              }

              for (const run of runs) {
                if (permissionDenied) {
                  break;
                }

                if (run.conclusion !== 'success') {
                  continue;
                }

                kept += 1;
                if (kept <= keepSuccessfulRuns) {
                  continue;
                }

                core.info(`Deleting run ${run.id} from ${run.created_at}`);
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });
                } catch (error) {
                  if (error.status === 403) {
                    core.warning('GITHUB_TOKEN lacks permission to delete workflow runs; skipping further pruning.');
                    permissionDenied = true;
                    break;
                  }
                  throw error;
                }
              }

              if (permissionDenied) {
                break;
              }

              if (runs.length < 100) {
                break;
              }

              page += 1;
            }
