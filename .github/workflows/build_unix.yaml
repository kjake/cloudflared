name: Build Native

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (defaults to latest published release)
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't let one leg's failure cancel the others — a new/older OS version
      # breaking must not stop the proven ones from building and uploading.
      fail-fast: false
      matrix:
        include:
          # FreeBSD: keep 14.x and track 15.x (OPNsense 25.7+ is FreeBSD 15).
          - os: freebsd
            release: "14.3"
            assetName: cloudflared-freebsd14-amd64
          - os: freebsd
            release: "15.1"
            assetName: cloudflared-freebsd15-amd64
          # NetBSD: keep 10.x and add 11.0.
          - os: netbsd
            release: "10.1"
            assetName: cloudflared-netbsd10-amd64
          - os: netbsd
            release: "11.0"
            assetName: cloudflared-netbsd11-amd64
          # OpenBSD: single latest release.
          - os: openbsd
            release: "7.9"
            assetName: cloudflared-openbsd7-amd64
    env:
      GOEXPERIMENT: "noboringcrypto"
      CGO_ENABLED: 0
      # BSD pkg managers ship Go with GOTOOLCHAIN=local baked in to disable
      # runtime downloads. Override so go.mod's `go 1.26` directive triggers
      # a toolchain auto-download from go.dev (binaries exist for all 3 BSDs).
      GOTOOLCHAIN: auto
    steps:
      - name: Resolve release ref
        id: get_release
        uses: actions/github-script@v8
        env:
          TAG_INPUT: ${{ inputs.tag }}
        with:
          script: |
            const tagInput = (process.env.TAG_INPUT || '').trim();
            let tagName = tagInput;

            if (tagInput) {
              core.info(`Using provided tag: ${tagInput}`);
            } else {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo
              });
              tagName = data.tag_name;
              core.info(`Using latest published release tag: ${tagName}`);
            }

            const checkoutRef = `release-${tagName}`;
            core.info(`Using release branch: ${checkoutRef}`);
            core.setOutput('tag_name', tagName);
            core.setOutput('checkout_ref', checkoutRef);

      - name: Checkout Release Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.get_release.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      # Build step for FreeBSD
      - name: Build from Source on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "${{ matrix.release }}"
          envs: "GOEXPERIMENT CGO_ENABLED GOTOOLCHAIN"
          usesh: true
          mem: 4096
          prepare: |
            export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/local/sbin:/usr/local/bin:$PATH
            export ASSUME_ALWAYS_YES=yes
            if [ -x /usr/sbin/pkg-static ]; then
              /usr/sbin/pkg-static bootstrap -f
            elif [ -x /usr/sbin/pkg ]; then
              /usr/sbin/pkg bootstrap -f
            elif command -v pkg-static >/dev/null 2>&1; then
              pkg-static bootstrap -f
            elif command -v pkg >/dev/null 2>&1; then
              pkg bootstrap -f
            else
              echo "Error: unable to find pkg bootstrap command" >&2
              exit 1
            fi
            pkg update -f
            pkg upgrade -f -y
            pkg install -f -y pcre2 gmake sudo bash git go golangci-lint curl wget fakeroot libffi rubygem-fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            # Do NOT run `go mod tidy` here — it sees only the current GOOS's
            # import graph and prunes vendor/modules.txt entries used on other
            # platforms, which then breaks `-mod=vendor` for those packages.
            # Upstream's vendor tree is already complete; trust it.
            go mod download
            go install golang.org/x/tools/cmd/goimports@latest
            # Stamp the release tag into the binary (main.Version). The build
            # runs while the GitHub release is still a draft, so the git tag
            # does not exist yet and the Makefile's `git describe` would fall
            # back to a bare commit SHA. Passing VERSION explicitly overrides it.
            gmake cloudflared VERSION="${{ steps.get_release.outputs.tag_name }}"

      # Build step for NetBSD
      - name: Build from Source on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: "${{ matrix.release }}"
          envs: "GOEXPERIMENT CGO_ENABLED GOTOOLCHAIN"
          usesh: true
          mem: 4096
          prepare: |
            export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/pkg/sbin:/usr/pkg/bin:$PATH
            PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -f '1 2' -d.)/All/"
            export PKG_PATH
            pkg_add -U pkgin pkg_alternatives
            pkgin update
            pkgin -y install gmake sudo bash git go golangci-lint curl wget fakeroot libffi ruby34
            pkg_alternatives rebuild
            gem34 install fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            # Do NOT run `go mod tidy` here — it sees only the current GOOS's
            # import graph and prunes vendor/modules.txt entries used on other
            # platforms, which then breaks `-mod=vendor` for those packages.
            # Upstream's vendor tree is already complete; trust it.
            go mod download
            go install golang.org/x/tools/cmd/goimports@latest
            # Stamp the release tag into the binary (main.Version). The build
            # runs while the GitHub release is still a draft, so the git tag
            # does not exist yet and the Makefile's `git describe` would fall
            # back to a bare commit SHA. Passing VERSION explicitly overrides it.
            gmake cloudflared VERSION="${{ steps.get_release.outputs.tag_name }}"

      # Build step for OpenBSD
      - name: Build from Source on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: "${{ matrix.release }}"
          envs: "GOEXPERIMENT CGO_ENABLED GOTOOLCHAIN"
          usesh: true
          mem: 4096
          prepare: |
            pkg_add -xaz gmake sudo-- bash git go curl wget libffi ruby-34
            gem34 install fpm
            git config --global --add safe.directory /home/runner/work/cloudflared/cloudflared
          run: |
            # Do NOT run `go mod tidy` here — it sees only the current GOOS's
            # import graph and prunes vendor/modules.txt entries used on other
            # platforms, which then breaks `-mod=vendor` for those packages.
            # Upstream's vendor tree is already complete; trust it.
            go mod download
            go install golang.org/x/tools/cmd/goimports@latest
            # Stamp the release tag into the binary (main.Version). The build
            # runs while the GitHub release is still a draft, so the git tag
            # does not exist yet and the Makefile's `git describe` would fall
            # back to a bare commit SHA. Passing VERSION explicitly overrides it.
            gmake cloudflared VERSION="${{ steps.get_release.outputs.tag_name }}"

      - name: Authenticate GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Upload build to GitHub Release
        run: |
          mv cloudflared ${{ matrix.assetName }}
          gh release upload "${{ steps.get_release.outputs.tag_name }}" \
            ${{ matrix.assetName }} \
            --clobber

      - name: Prune older successful runs
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepSuccessfulRuns = 7;
            const workflowRef = process.env.GITHUB_WORKFLOW_REF || '';
            const workflowFile = workflowRef
              ? workflowRef.split('@')[0].split('/').pop()
              : 'build_unix.yaml';

            let kept = 0;
            let page = 1;
            let permissionDenied = false;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                status: 'completed',
                per_page: 100,
                page
              });

              const runs = data.workflow_runs;
              if (!runs.length) {
                break;
              }

              for (const run of runs) {
                if (permissionDenied) {
                  break;
                }

                if (run.conclusion !== 'success') {
                  continue;
                }

                kept += 1;
                if (kept <= keepSuccessfulRuns) {
                  continue;
                }

                core.info(`Deleting run ${run.id} from ${run.created_at}`);
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id
                  });
                } catch (error) {
                  if (error.status === 403) {
                    core.warning('GITHUB_TOKEN lacks permission to delete workflow runs; skipping further pruning.');
                    permissionDenied = true;
                    break;
                  }
                  throw error;
                }
              }

              if (permissionDenied) {
                break;
              }

              if (runs.length < 100) {
                break;
              }

              page += 1;
            }
